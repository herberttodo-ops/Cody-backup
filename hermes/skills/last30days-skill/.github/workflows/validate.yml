name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@___LONG_STRING___ # v7.0.1
        with:
          persist-credentials: false

      - name: Build uploadable skill package
        run: bash skills/last30days/scripts/build-skill.sh

      - name: Install uv
        uses: astral-sh/setup-uv@___LONG_STRING___ # v10.3.3

      - name: Set up Python
        run: uv python install 3.12

      - name: Run test suite
        run: uv run pytest -n auto --dist worksteal --cov --cov-report=term-missing

  windows-process-tree:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@___LONG_STRING___ # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@___LONG_STRING___ # v10.3.3

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Windows subprocess tests
        env:
          PYTHONPATH: ${{ github.workspace }}/skills/last30days/scripts
        run: uv run python -m unittest tests.test_subproc -v

  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@___LONG_STRING___ # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@___LONG_STRING___ # v10.3.3

      - name: Set up Python
        run: uv python install 3.12

      - name: Score research quality
        run: uv run pytest tests/eval -x -s

  mcp-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@___LONG_STRING___ # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@___LONG_STRING___ # v7.0.0
        with:
          go-version: "1.25.5"
          cache-dependency-path: mcp/go.sum

      - name: Sync vendored engine
        run: bash mcp/scripts/sync-engine.sh

      - name: Run MCP Go tests
        run: go test -race ./...
        working-directory: mcp
